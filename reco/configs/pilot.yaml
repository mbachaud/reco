# until a GEMINI_API_KEY makes Google's Track B seat available.
# Spawn zones by roster order: a1 forest (wood), a2 mountain (stone), a3 plains (meal).
seed: 42
ticks: 10
content: slice
timeout_s: 240
concurrency:
  anthropic: 1
  openai: 1
agents:
